name: build-and-test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go vet ./...
      - run: bash scripts/build.sh
      - name: Install published package through the universal bootstrap
        run: |
          # Avoid the raw endpoint's short cache window immediately after a push.
          if ! (set -o pipefail; curl -fsSL 'https://raw.githubusercontent.com/shushu594088/meshport/${{ github.sha }}/install.sh' | sudo bash -s -- --port 18888) > /tmp/meshport-install-check.log 2>&1; then
            sed -E 's/(初始化凭[据证].*[：:]).*/\1[REDACTED]/' /tmp/meshport-install-check.log
            exit 1
          fi
          test "$(systemctl is-enabled meshport)" = enabled
          test "$(systemctl is-enabled meshport-mihomo)" = disabled
          test "$(systemctl is-active meshport)" = active
          curl --fail --silent http://127.0.0.1:18888/api/auth | grep '"initialized":false'
          if sudo bash ./install.sh --version v0.1.0 --port 18888 > /tmp/meshport-repeat-check.log 2>&1; then
            echo 'Repeat install unexpectedly overwrote the installation'; exit 1
          fi
          test "$(systemctl is-active meshport)" = active
          sudo bash /usr/libexec/meshport-uninstall --purge
          test ! -e /usr/bin/meshport
          test ! -e /usr/libexec/meshport-uninstall
          test ! -d /var/lib/meshport
      - uses: actions/upload-artifact@v4
        with:
          name: meshport-linux-packages
          path: |
            build/meshport-0.1.0-linux-*.tar.gz
            build/SHA256SUMS
            build/INSTALL-TARGETS.tsv
